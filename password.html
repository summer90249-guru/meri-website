<style>
  body { text-align: center; background-color: lightgray; font-family: Arial; }
  button { padding: 12px 20px; font-size: 18px; background-color: black; color: white; border-radius: 10px; }
  h2 { color: blue; }
</style>

<h1>Password Generator</h1>
<p>Button dabao, naya strong password ban jayega</p>

<button onclick="banao()">Password Banao</button>
<h2 id="result"></h2>

<script>
function banao() {
  let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$";
  let pass = "";
  for (let i = 0; i < 10; i++) {
    let random = Math.floor(Math.random() * chars.length);
    pass += chars[random];
  }
  document.getElementById("result").innerText = pass;
}
</script>
